<svg width="100%" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: 2px;
      fill: #ffffff;
    }
    .badge-text {
      font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #10b981;
    }
    .subtitle {
      font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1.5px;
      fill: #94a3b8;
    }
    .tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #cbd5e1;
    }
  </style>

  <!-- Card Background -->
  <rect width="900" height="240" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="900" height="240" rx="16" fill="url(#grid)" />

  <!-- Top Decorative Bar / Glow Line -->
  <path d="M 30 1 L 870 1" stroke="url(#emeraldGrad)" stroke-width="2" stroke-linecap="round" filter="url(#glow)" opacity="0.8" />

  <!-- Window dots (macOS / terminal style) -->
  <circle cx="36" cy="32" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="54" cy="32" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="72" cy="32" r="5" fill="#10b981" opacity="0.8" />

  <!-- Status Pill (Top Right) -->
  <g transform="translate(680, 22)">
    <rect width="185" height="26" rx="13" fill="#111c2e" stroke="#1e3a5f" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="17" class="badge-text">BUILDING &amp; SECURING</text>
  </g>

  <!-- Center Content -->
  <g transform="translate(450, 105)" text-anchor="middle">
    <!-- Code Bracket prefix -->
    <text x="0" y="0" class="title">
      <tspan fill="#10b981" font-weight="300">&lt;</tspan> YANN-AXEL ADINGRA <tspan fill="#10b981" font-weight="300">/&gt;</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="32" class="subtitle">
      SOFTWARE ENGINEERING • CLOUD ARCHITECTURE • APPSEC
    </text>
  </g>

  <!-- Bottom Pills Row -->
  <g transform="translate(185, 175)">
    <!-- Pill 1: School -->
    <rect x="0" y="0" width="165" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="82" y="18" text-anchor="middle" class="tag">🎓 Prépa ENSIT (CI)</text>

    <!-- Pill 2: Project -->
    <rect x="180" y="0" width="170" height="28" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.6" />
    <text x="265" y="18" text-anchor="middle" class="tag" fill="#34d399">🚀 Créateur de Noteo</text>

    <!-- Pill 3: Focus -->
    <rect x="365" y="0" width="165" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="447" y="18" text-anchor="middle" class="tag">🛡️ Sécurité &amp; RLS</text>
  </g>
</svg>
